name: Build dev site

on:
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: build-dev
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: develop

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Build dev
        run: npm run generate:dev

      - name: Verify build
        run: npx env-cmd -f .env.development npm run verify:build -- https://dev.ciprianibatumi.com

      - name: Checkout deploy branch
        uses: actions/checkout@v4
        with:
          ref: deploy-dev
          path: deploy

      - name: Copy build without video
        run: rsync -a --delete --exclude='.git' --exclude='.gitignore' --exclude='.DS_Store' --exclude='video/' .output/public/ deploy/

      - name: Commit and push
        working-directory: deploy
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Dev build from ${GITHUB_SHA::7}"
          git push origin deploy-dev
